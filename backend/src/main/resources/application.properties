# =============================================================================
# TaskFlow Backend Configuration
# =============================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=taskflow-backend

# Datasource: Archivo embebido persistente con dialecto PostgreSQL (Cero instalaciones externas)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/taskflow_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging
logging.level.com.taskflow=INFO
logging.level.org.springframework.web=INFO
