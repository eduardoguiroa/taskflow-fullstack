name: TaskFlow CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # 1. Job Backend: Compilación y Pruebas Unitarias/Integración (Spring Boot)
  # =========================================================================
  backend-test:
    name: Backend (Java & Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Compilar y ejecutar pruebas de backend (JUnit 5 + Mockito)
        working-directory: ./backend
        run: ./mvnw clean test

  # =========================================================================
  # 2. Job Frontend: Dependencias y Compilación de Producción (React + Vite)
  # =========================================================================
  frontend-build:
    name: Frontend (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Compilar frontend para producción (Vite build)
        working-directory: ./frontend
        run: npm run build
